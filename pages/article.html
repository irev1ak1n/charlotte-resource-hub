<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | Charlotte Resource Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <link rel="icon" href="../assets/img/icon.jpg" type="image/x-icon">

    <link rel="stylesheet" href="../assets/css/core/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/components/newsletter.css">
    <link rel="stylesheet" href="../assets/css/components/footer.css">
    <link rel="stylesheet" href="../assets/css/pages/article.css">
</head>

<body>
<div id="siteNav"></div>

<main class="article-wrap">
    <div class="container article-container">
        <header class="article-head">
            <!-- eyebrow (like "OUTDOORS & ADVENTURE") -->
            <div class="article-eyebrow" id="aEyebrow"></div>

            <h1 id="aTitle" class="article-title"></h1>

            <!-- subtitle under title -->
            <p id="aDek" class="article-dek"></p>

            <!-- byline row -->
            <div class="article-byline">
                <span class="article-by" id="aBy"></span>
                <span class="article-dot" aria-hidden="true">•</span>
                <time class="article-date" id="aDate"></time>
                <span class="article-dot article-dot-2" aria-hidden="true">•</span>
                <span class="article-source" id="aSource"></span>
            </div>

            <!-- your tag + loc line can stay (small meta row) -->
            <div class="article-meta">
                <span id="aTag" class="hl-tag"></span>
                <span id="aLoc" class="hl-loc"></span>
            </div>
        </header>

        <!-- Text 1 -->
        <section class="article-section">
            <div id="aText1" class="article-text"></div>
        </section>

        <!-- Image 1 -->
        <figure class="article-figure" id="fig1">
            <img id="aImg1" class="article-img" alt="" loading="lazy" />
            <figcaption id="aCap1" class="article-cap"></figcaption>
        </figure>

        <!-- Text 2 -->
        <section class="article-section">
            <div id="aText2" class="article-text"></div>
        </section>

        <!-- Image 2 -->
        <figure class="article-figure" id="fig2">
            <img id="aImg2" class="article-img" alt="" loading="lazy" />
            <figcaption id="aCap2" class="article-cap"></figcaption>
        </figure>

        <!-- Text 3 -->
        <section class="article-section article-section-last">
            <div id="aText3" class="article-text"></div>
        </section>

        <div class="article-actions">
            <button class="hl-btn hl-btn-ghost" id="backBtn">← Back</button>

            <a class="hl-btn" id="primaryReturnBtn" href="/pages/news.html">
                Back to News
            </a>
        </div>
    </div>

    <section class="more-wrap" id="moreWrap">
        <div class="container">
            <div class="more-head">
                <h2 class="more-title" id="moreTitle">More Happenings</h2>
                <a class="more-link" id="moreLink" href="/pages/news.html">View all</a>
            </div>
            <div id="moreGrid" class="more-grid"></div>
        </div>
    </section>

</main>

<div id="siteFooter"></div>

<script src="../assets/js/core/includes.footer.js" defer></script>
<script src="../assets/js/core/newsletter.js" defer></script>
<script src="../assets/js/core/includes.nav.js" defer></script>
<script>
    (async function () {
        try {
            const params = new URLSearchParams(location.search);
            const id = (params.get("id") || "").trim();

            // NEW: mode (news vs guide)
            const type = (params.get("type") || "news").trim().toLowerCase();
            const isGuide = type === "guide";

            // ---------- elements ----------
            const eyebrowEl = document.getElementById("aEyebrow");
            const titleEl = document.getElementById("aTitle");
            const dekEl = document.getElementById("aDek");
            const byEl = document.getElementById("aBy");
            const dateEl = document.getElementById("aDate");
            const sourceEl = document.getElementById("aSource");

            const tagEl = document.getElementById("aTag");
            const locEl = document.getElementById("aLoc");

            const text1El = document.getElementById("aText1");
            const text2El = document.getElementById("aText2");
            const text3El = document.getElementById("aText3");

            const img1El = document.getElementById("aImg1");
            const img2El = document.getElementById("aImg2");

            const cap1El = document.getElementById("aCap1");
            const cap2El = document.getElementById("aCap2");

            const fig1 = document.getElementById("fig1");
            const fig2 = document.getElementById("fig2");

            const backBtn = document.getElementById("backBtn");

            // NEW: primary return link
            const primaryReturnBtn = document.getElementById("primaryReturnBtn");

            // NEW: More section ids
            const moreWrap = document.getElementById("moreWrap");
            const moreTitle = document.getElementById("moreTitle");
            const moreLink = document.getElementById("moreLink");
            const moreGrid = document.getElementById("moreGrid");

            // ---------- helpers ----------
            function escapeHTML(str) {
                return String(str ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            // Works on localhost clean route (/pages/article) AND static html (/pages/article.html)
            function getArticlePath() {
                const p = (location.pathname || "").toLowerCase();
                if (p.endsWith("/article.html") || p.includes("article.html")) return "/pages/article.html";
                return "/pages/article";
            }

            function renderBlock(line) {
                const s = String(line || "").trim();
                if (!s) return "";

                if (s.startsWith("## ")) {
                    const heading = s.slice(3).trim();
                    return `<h2 class="article-h2">${escapeHTML(heading)}</h2>`;
                }
                return `<p>${escapeHTML(s)}</p>`;
            }

            const toHTML = (arr) => (arr || []).map(renderBlock).join("");

            function safeHide(el) {
                if (el) el.style.display = "none";
            }

            function safeShow(el) {
                if (el) el.style.display = "";
            }

            function setText(el, text) {
                if (el) el.textContent = text ?? "";
            }

            function setHTML(el, html) {
                if (el) el.innerHTML = html ?? "";
            }

            function hideMore() {
                if (moreWrap) moreWrap.style.display = "none";
            }

            // ---------- buttons and More section mode ----------
            if (primaryReturnBtn) {
                if (isGuide) {
                    primaryReturnBtn.href = "/#services";
                    primaryReturnBtn.textContent = "Back to Home";
                } else {
                    primaryReturnBtn.href = "/pages/news.html";
                    primaryReturnBtn.textContent = "Back to News";
                }
            }

            if (isGuide) {
                if (moreTitle) moreTitle.textContent = "More Guides";
                if (moreLink) {
                    moreLink.textContent = "View all";
                    moreLink.href = "/#services";
                }
            } else {
                if (moreTitle) moreTitle.textContent = "More Happenings";
                if (moreLink) {
                    moreLink.textContent = "View all";
                    moreLink.href = "/pages/news.html";
                }
            }

            // ---------- Back button behavior (history-aware) ----------
            if (backBtn) {
                backBtn.addEventListener("click", () => {
                    if (window.history.length > 1) window.history.back();
                    else window.location.href = isGuide ? "/#services" : "/pages/news.html";
                });
            }

            // ---------- guard: no id ----------
            if (!id) {
                setText(titleEl, "No article selected");
                setHTML(text1El, `<p>Please go back and open an article.</p>`);
                safeHide(fig1);
                safeHide(fig2);
                hideMore();
                return;
            }

            // ---------- fetch data ----------
            const res = await fetch("/data/news.json", { cache: "no-store" });
            if (!res.ok) throw new Error("news.json not found (status " + res.status + ")");

            const items = await res.json();
            const item = items.find((x) => x.id === id);

            if (!item) {
                setText(titleEl, "Article not found");
                setHTML(
                    text1El,
                    `<p>That article id does not exist: <strong>${escapeHTML(id)}</strong></p>`
                );
                safeHide(fig1);
                safeHide(fig2);
                hideMore();
                return;
            }

            // ---------- header fill ----------
            document.title = (item.title || "Article") + " | Charlotte Resource Hub";
            setText(titleEl, item.title || "");

            // Eyebrow: section -> tag
            setText(eyebrowEl, String(item.section || item.tag || "").toUpperCase());

            // Dek
            setText(dekEl, item.subtitle || item.dek || "");
            if (!dekEl || !dekEl.textContent.trim()) safeHide(dekEl);

            // Author
            const author = item.author || "Charlotte Resource Hub Staff";
            setText(byEl, "By " + author);

            // Date
            const d = item.date ? new Date(item.date) : null;
            if (d && !isNaN(d.getTime())) {
                const pretty = d.toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                });
                setText(dateEl, pretty);
                dateEl.setAttribute("datetime", d.toISOString().slice(0, 10));
            } else {
                setText(dateEl, "Updated recently");
                dateEl.removeAttribute("datetime");
            }

            // Source (optional)
            setText(sourceEl, item.source || "");
            if (!sourceEl || !sourceEl.textContent.trim()) {
                safeHide(sourceEl);
                const dot2 = document.querySelector(".article-dot-2");
                safeHide(dot2);
            }

            // Meta (tag + loc)
            setText(tagEl, item.tag || "");
            setText(locEl, item.loc || "");
            if (!tagEl || !tagEl.textContent.trim()) safeHide(tagEl);
            if (!locEl || !locEl.textContent.trim()) safeHide(locEl);

            // ---------- content ----------
            const intro = Array.isArray(item.intro) ? item.intro : [];
            const body = Array.isArray(item.body) ? item.body : [];

            // Intro as one "lead" paragraph
            const text1 = intro.length ? [intro.join(" ")] : [];

            // Body chunks
            const text2 = body.slice(0, 4);
            const text3 = body.slice(4);

            setHTML(text1El, toHTML(text1));
            setHTML(text2El, toHTML(text2));
            setHTML(text3El, toHTML(text3));

            // ---------- images ----------
            const img1 = item.img;
            const img2 = item.img2 || item.img;

            if (img1 && String(img1).trim()) {
                img1El.src = img1;
                img1El.alt = item.title || "Article image";
                safeShow(fig1);
            } else {
                safeHide(fig1);
            }

            if (img2 && String(img2).trim()) {
                img2El.src = img2;
                img2El.alt = (item.title || "Article image") + " photo";
                safeShow(fig2);
            } else {
                safeHide(fig2);
            }

            setText(cap1El, item.caption1 || "");
            setText(cap2El, item.caption2 || "");
            if (!cap1El || !cap1El.textContent.trim()) safeHide(cap1El);
            if (!cap2El || !cap2El.textContent.trim()) safeHide(cap2El);

            // ---------- More cards ----------
            if (moreGrid) {
                const others = items
                    .filter((x) => x.id !== id)
                    .filter((x) =>
                        isGuide
                            ? (x.type === "guide" || x.section === "Guides")
                            : (x.type !== "guide" && x.section !== "Guides")
                    )
                    .slice(0, 4);

                if (!others.length) {
                    hideMore();
                } else {
                    const articlePath = getArticlePath();

                    moreGrid.innerHTML = others
                        .map((x) => {
                            const href = `${articlePath}?type=${isGuide ? "guide" : "news"}&id=${encodeURIComponent(
                                x.id
                            )}`;
                            const img = String(x.img || "").replaceAll("'", "%27");

                            return `
                <a class="more-card" href="${href}">
                  <div class="more-media" style="--img:url('${img}')"></div>
                  <div class="more-body">
                    <div class="more-meta">
                      <span class="more-tag">${escapeHTML(x.tag || "")}</span>
                      <span class="more-loc">${escapeHTML(x.loc || "")}</span>
                    </div>
                    <h3 class="more-h3">${escapeHTML(x.title || "")}</h3>
                  </div>
                </a>
              `;
                        })
                        .join("");
                }
            }
        } catch (err) {
            console.error(err);

            const title = document.getElementById("aTitle");
            const text1 = document.getElementById("aText1");
            const fig1 = document.getElementById("fig1");
            const fig2 = document.getElementById("fig2");
            const moreWrap = document.getElementById("moreWrap");

            if (title) title.textContent = "Could not load article";
            if (text1) text1.innerHTML = `<p>Open DevTools and check the console for the error.</p>`;
            if (fig1) fig1.style.display = "none";
            if (fig2) fig2.style.display = "none";
            if (moreWrap) moreWrap.style.display = "none";
        }
    })();
</script>


</body>
</html>
