<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directory • Charlotte Resource Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/core/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/components/newsletter.css">
    <link rel="stylesheet" href="../assets/css/components/footer.css">
    <link rel="stylesheet" href="../assets/css/pages/directory.css">

</head>

<body>

<section class="hero">
    <div class="hero-rings"></div>

    <!-- nav implementation -->
    <div id="siteNav"></div>

    <div class="hero-content">
        <div class="container hero-grid">
            <div class="hero-left">
                <h1 class="headline headline-uw">
                    <span>FOR THE GREATER</span>
                    <span>GOOD IN GREATER</span>
                    <span>CHARLOTTE</span>
                </h1>
            </div>
        </div>
    </div>
</section>

<main class="home-section" style="padding-top: 130px;">
    <div class="container">

        <div class="section-head">
            <h2>Resource Directory</h2>
        </div>

        <!-- quick filter/search  -->
        <!-- Directory toolbar -->
        <div class="dir-toolbar" aria-label="Directory controls">
            <div class="dir-controls">
                <label class="dir-field dir-search">
                    <span class="sr-only">Search</span>
                    <span class="dir-icon" aria-hidden="true">⌕</span>
                    <input id="resourceSearch" type="search" placeholder="Search resources, categories, keywords…" />
                </label>

                <label class="dir-field">
                    <span class="dir-label">Category</span>
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                    </select>
                </label>

                <label class="dir-field">
                    <span class="dir-label">Sort</span>
                    <select id="sortSelect">
                        <option value="name-asc">Name (A → Z)</option>
                        <option value="name-desc">Name (Z → A)</option>
                        <option value="category-asc">Category (A → Z)</option>
                        <option value="category-desc">Category (Z → A)</option>
                    </select>
                </label>
            </div>

            <div class="dir-meta">
                <div id="resourceStatus" class="dir-status">Loading…</div>
                <div class="dir-actions">
                    <button id="clearFilters" class="dir-btn" type="button">Clear</button>
                </div>
            </div>
        </div>

        <ul id="resourceList" class="dir-list" aria-live="polite"></ul>

        <div id="resourceStatus" style="margin: 6px 0 12px; font-weight:600;"></div>
        <ul id="resourceList" style="display:grid; gap:10px; padding-left: 0; list-style:none;"></ul>

    </div>
</main>

<div id="siteFooter"></div>

<script src="../assets/js/core/includes.footer.js" defer></script>
<script src="../assets/js/core/includes.nav.js" defer></script>
<script src="../assets/js/core/newsletter.js" defer></script>
<script src="../assets/js/directory.js" defer></script>

</body>
</html>
