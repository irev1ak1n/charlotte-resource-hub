<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directory • Charlotte Resource Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/newsletter.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
</head>

<body>

<section class="hero">
    <div class="hero-rings"></div>

    <div class="hero-top">
        <div class="container top-row">

            <a href="../index.html" class="brand brand-uw" aria-label="Go to homepage">
                <div class="brand-text">
                    <strong>Charlotte Resource Hub</strong>
                    <span>The Queen City Community Resources</span>
                </div>
            </a>

            <nav class="nav">
                <a href="../pages/about.html">About</a>
                <a href="../pages/about.html">What We Do</a>
                <a href="../pages/directory.html"class="is-active">Directory</a>
                <a href="../pages/get-involved.html">Get Involved</a>
                <a href="../pages/references.html">References</a>
                <a href="../pages/highlights.html">The Latest</a>
            </nav>


            <div class="nav-search" role="search" aria-label="Search resources">
                <input
                        id="navSearchInput"
                        type="search"
                        placeholder="Search resources..."
                        aria-label="Search resources"
                />
                <button id="navSearchBtn" type="button" aria-label="Search">
                    <svg class="nav-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10.5 18a7.5 7.5 0 1 1 5.3-12.8A7.5 7.5 0 0 1 10.5 18Z"
                              fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M16.3 16.3 21 21"
                              fill="none" stroke="currentColor" stroke-width="2"
                              stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <div class="hero-content">
        <div class="container hero-grid">
            <div class="hero-left">
                <h1 class="headline headline-uw">
                    <span>FOR THE GREATER</span>
                    <span>GOOD IN GREATER</span>
                    <span>CHARLOTTE</span>
                </h1>
            </div>
        </div>
    </div>
</section>

<main class="home-section" style="padding-top: 130px;">
    <div class="container">

        <div class="section-head">
            <h2>Resource Directory</h2>
            <p class="section-lead">
                This list loads from <code>data/resources.json</code> (no backend).
            </p>
        </div>

        <!-- quick filter/search  -->
        <div style="display:grid; gap:12px; max-width: 520px; margin: 18px 0 22px;">
            <input id="resourceSearch" type="text" placeholder="Search by name or category..."
                   style="height:48px; padding:0 14px; border-radius:10px; border:1px solid rgba(0,0,0,.18);" />
            <select id="categoryFilter"
                    style="height:48px; padding:0 14px; border-radius:10px; border:1px solid rgba(0,0,0,.18);">
                <option value="">All categories</option>
            </select>
        </div>

        <div id="resourceStatus" style="margin: 6px 0 12px; font-weight:600;"></div>
        <ul id="resourceList" style="display:grid; gap:10px; padding-left: 0; list-style:none;"></ul>

    </div>
</main>

<div id="siteFooter"></div>

<script src="../assets/js/index.js" defer></script>
<script src="../assets/js/includes.js" defer></script>
<script src="../assets/js/newsletter.js" defer></script>

</body>
</html>
