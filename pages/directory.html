<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directory • Charlotte Resource Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/core/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/components/newsletter.css">
    <link rel="stylesheet" href="../assets/css/components/footer.css">
</head>

<body>

<section class="hero">
    <div class="hero-rings"></div>

    <!-- nav implementation -->
    <div id="siteNav"></div>

    <div class="hero-content">
        <div class="container hero-grid">
            <div class="hero-left">
                <h1 class="headline headline-uw">
                    <span>FOR THE GREATER</span>
                    <span>GOOD IN GREATER</span>
                    <span>CHARLOTTE</span>
                </h1>
            </div>
        </div>
    </div>
</section>

<main class="home-section" style="padding-top: 130px;">
    <div class="container">

        <div class="section-head">
            <h2>Resource Directory</h2>
            <p class="section-lead">
                This list loads from <code>data/resources.json</code> (no backend).
            </p>
        </div>

        <!-- quick filter/search  -->
        <div style="display:grid; gap:12px; max-width: 520px; margin: 18px 0 22px;">
            <input id="resourceSearch" type="text" placeholder="Search by name or category..."
                   style="height:48px; padding:0 14px; border-radius:10px; border:1px solid rgba(0,0,0,.18);" />
            <select id="categoryFilter"
                    style="height:48px; padding:0 14px; border-radius:10px; border:1px solid rgba(0,0,0,.18);">
                <option value="">All categories</option>
            </select>
        </div>

        <div id="resourceStatus" style="margin: 6px 0 12px; font-weight:600;"></div>
        <ul id="resourceList" style="display:grid; gap:10px; padding-left: 0; list-style:none;"></ul>

    </div>
</main>

<div id="siteFooter"></div>

<!--<script src="../assets/js/index.js" defer></script>-->
<script src="../assets/js/core/includes.footer.js" defer></script>
<script src="../assets/js/core/includes.nav.js" defer></script>
<script src="../assets/js/core/newsletter.js" defer></script>
<script src="../assets/js/directory.js" defer></script>

</body>
</html>
