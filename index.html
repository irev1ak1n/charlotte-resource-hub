<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlotte Resource Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/core/global.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/components/newsletter.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
</head>

<body>

<section class="hero">
    <div class="hero-rings"></div>

    <!-- nav implementation -->
    <div id="siteNav"></div>

    <div class="hero-content">
        <div class="container hero-grid">
            <div class="hero-left">
                <h1 class="headline headline-uw">
                    <span>FOR THE GREATER</span>
                    <span>GOOD IN GREATER</span>
                    <span>CHARLOTTE</span>
                </h1>
            </div>
        </div>
    </div>
</section>

<section class="home-section" id="services">
    <div class="container">
        <div class="clt-cards">
            <a class="clt-card" href="#events" style="--img:url('/assets/img/shopping.jpg');">
                <span class="clt-card__tag">SHOPPING</span>
                <div class="clt-card__shade"></div>
                <div class="clt-card__content">
                    <h3>A Guide to Shopping in Charlotte</h3>
                </div>
            </a>

            <a class="clt-card" href="#events" style="--img:url('/assets/img/winter-in-charlotte.jpg');">
                <span class="clt-card__tag">OUTDOORS &amp; ADVENTURE</span>
                <div class="clt-card__shade"></div>
                <div class="clt-card__content">
                    <h3>Experience Winter at the Whitewater Center</h3>
                </div>
            </a>

            <a class="clt-card" href="#highlights" style="--img:url('/assets/img/spa.jpg');">
                <span class="clt-card__tag">THINGS TO DO</span>
                <div class="clt-card__shade"></div>
                <div class="clt-card__content">
                    <h3>The Ultimate Charlotte Spa Guide</h3>
                </div>
            </a>

            <a class="clt-card" href="#latest" style="--img:url('/assets/img/just-opened-in-charlotte.jpg');">
                <span class="clt-card__tag">EAT &amp; DRINK</span>
                <div class="clt-card__shade"></div>
                <div class="clt-card__content">
                    <h3>Just Opened in Charlotte — February 2026</h3>
                </div>
            </a>
        </div>
    </div>
</section>

<!-- footer implementation -->
<div id="siteFooter"></div>

<script src="assets/js/core/includes.footer.js" defer></script>
<script src="assets/js/core/includes.nav.js" defer></script>
<script src="assets/js/core/newsletter.js" defer></script>

</body>
</html>
